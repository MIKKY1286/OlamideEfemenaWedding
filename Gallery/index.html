<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Olamide & Efemena</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Lato', sans-serif;
    background: #FDF6E3;
    margin: 0;
}

.playfair { font-family: 'Playfair Display', serif; }

/* HERO */
.hero {
    background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.6)),
    url('./images/img-17.jpg');
    background-size: cover;
    background-position: center;
}

/* BUTTONS */
.btn {
    background: linear-gradient(to right,#A8C090,#D4AF37);
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    transition: .3s;
}
.btn:hover { transform: scale(1.05); }

/* GALLERY GRID */
.gallery {
    column-count: 3;
    column-gap: 15px;
    padding: 20px;
}

@media(max-width:768px){ .gallery { column-count:2; } }
@media(max-width:500px){ .gallery { column-count:1; } }

.gallery img {
    width: 100%;
    margin-bottom: 15px;
    border-radius: 15px;
    cursor: pointer;
    transition: .4s;
}

.gallery img:hover {
    transform: scale(1.03);
}

/* LIGHTBOX */
.lightbox {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,.95);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:999;
}

.lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 10px;
}

/* FADE TRANSITION */
.fade {
    opacity: 0;
    transition: 0.8s ease;
}
.fade.show {
    opacity: 1;
}

/* MUSIC PLAYER */
.music {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: white;
    padding: 10px 15px;
    border-radius: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
}
</style>

</head>

<body>

<!-- HERO -->
<section class="hero min-h-[50vh] flex items-center justify-center text-white text-center px-4">
<div class="fade">
<h1 class="text-5xl playfair mb-4">Our Gallery</h1>
<p>Moments that last forever</p>

<div class="mt-6 flex gap-4 justify-center">
<a href="../index.html" class="btn">Home</a>
<button onclick="toggleSlideshow()" class="btn">Slideshow</button>
</div>

</div>
</section>

<!-- LIGHTWIDGET FALLBACK -->
<section class="py-10 text-center fade">
<h2 class="playfair text-2xl mb-4">From Our Socials</h2>
<iframe src="https://lightwidget.com/widgets/YOUR_WIDGET_ID.html"
style="width:100%;border:0;height:500px;"></iframe>
</section>

<!-- LOCAL GALLERY -->
<div class="gallery fade" id="gallery">

<!-- KEEP ALL YOUR IMAGES -->
<img src="./images/img-1.jpg">
<img src="./images/img-2.jpg">
<img src="./images/img-3.jpg">
<img src="./images/img-4.jpg">
<img src="./images/img-5.jpg">
<img src="./images/img-6.jpg">
<img src="./images/img-7.jpg">
<img src="./images/img-8.jpg">
<img src="./images/img-9.jpg">
<img src="./images/img-10.jpg">
<img src="./images/img-11.jpg">
<img src="./images/img-12.jpg">

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
<img id="lightboxImg">
</div>

<!-- MUSIC -->
<div class="music">
<button onclick="toggleMusic()">▶️</button>
<span>Our Song</span>
<audio id="audio" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>
</div>

<script>

/* FADE IN */
const observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
        if(e.isIntersecting) e.target.classList.add('show');
    });
});
document.querySelectorAll('.fade').forEach(el=>observer.observe(el));

/* LIGHTBOX + SWIPE */
let images = document.querySelectorAll('.gallery img');
let current = 0;

images.forEach((img,i)=>{
    img.onclick = ()=>{
        current = i;
        openLightbox(img.src);
    };
});

function openLightbox(src){
    document.getElementById('lightbox').style.display='flex';
    document.getElementById('lightboxImg').src = src;
}

document.getElementById('lightbox').onclick = ()=>closeLightbox();

function closeLightbox(){
    document.getElementById('lightbox').style.display='none';
}

/* NEXT / PREV */
function next(){
    current++;
    if(current >= images.length) current = 0;
    openLightbox(images[current].src);
}

function prev(){
    current--;
    if(current < 0) current = images.length - 1;
    openLightbox(images[current].src);
}

/* SWIPE GESTURE */
let startX = 0;

document.getElementById('lightbox').addEventListener('touchstart',e=>{
    startX = e.touches[0].clientX;
});

document.getElementById('lightbox').addEventListener('touchend',e=>{
    let endX = e.changedTouches[0].clientX;

    if(startX - endX > 50) next();
    if(endX - startX > 50) prev();
});

/* AUTO SLIDESHOW */
let slideshow = false;
let slideInterval;

function toggleSlideshow(){
    slideshow = !slideshow;

    if(slideshow){
        slideInterval = setInterval(()=>{
            next();
        }, 3000);
    } else {
        clearInterval(slideInterval);
    }
}

/* PERSISTENT MUSIC */
const audio = document.getElementById('audio');

function toggleMusic(){
    if(audio.paused){
        audio.play();
        localStorage.setItem('music','on');
    } else {
        audio.pause();
        localStorage.setItem('music','off');
    }
}

/* KEEP MUSIC ACROSS PAGES */
window.onload = ()=>{
    if(localStorage.getItem('music') === 'on'){
        audio.play();
    }
};

/* FETCH INSTAGRAM (BACKEND) */
async function loadInstagram(){
    try {
        let res = await fetch('http://localhost:3000/images');
        let data = await res.json();

        let gallery = document.getElementById('gallery');

        data.forEach(item=>{
            let img = document.createElement('img');
            img.src = item.media_url;

            img.onclick = ()=> openLightbox(item.media_url);

            gallery.appendChild(img);
        });

    } catch(e){
        console.log('Instagram load failed');
    }
}

loadInstagram();

</script>

</body>
</html>
